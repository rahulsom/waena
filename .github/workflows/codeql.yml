name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 19 * * 4'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Set up Java 17
      if: matrix.build-mode == 'manual'
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.39.5
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Compile Java and Kotlin
      if: matrix.build-mode == 'manual'
      run: ./gradlew assemble --no-daemon --no-build-cache --stacktrace

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.39.5
      with:
        category: "/language:${{matrix.language}}"
