name: Build

on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        jdk: ${{ github.event_name == 'pull_request' && fromJSON('["17", "21", "25"]') || fromJSON('["17"]') }}
        gradle: [wrapper, current]
        exclude:
          # Gradle 8 does not fully support running on Java 25.
          - gradle: wrapper
            jdk: '25'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # full history so current commit has its tag for nebula-release useLastTag

      - uses: gradle/actions/wrapper-validation@v6.4.1

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.jdk }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build with the wrapper
        if: matrix.gradle == 'wrapper' && !startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew build --stacktrace --parallel --scan

      - name: Build with the latest stable Gradle
        if: matrix.gradle == 'current'
        run: gradle build --stacktrace --parallel --scan

      - name: Build (Release)
        if: matrix.gradle == 'wrapper' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          ./gradlew -Prelease.useLastTag=true build final --stacktrace --scan

  build-result:
    name: Build result
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}
    steps:
      - name: Check build matrix result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$BUILD_RESULT" != success ]]; then
            echo "::error::Build matrix finished with status: $BUILD_RESULT"
            exit 1
          fi